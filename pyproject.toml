[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inkling-autofix"
version = "0.1.0"
description = "Small self-hosted OpenAI-compatible repository repair runner"
requires-python = ">=3.10"
dependencies = ["openai>=1.0", "pyyaml"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
autofix = "autofix.cli:main"

[tool.setuptools.packages.find]
include = ["autofix*"]

[tool.setuptools.package-data]
autofix = ["templates/*.yaml", "config.example.yaml"]
