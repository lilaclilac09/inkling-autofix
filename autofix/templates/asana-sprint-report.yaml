name: asana-sprint-report
category: Project Management
description: "Sprint Progress Report"
trigger:
  type: command
required_env: [AUTOFIX_EVENT_COMMAND]
notes: "Integrations: asana, slack. Set event_command or AUTOFIX_EVENT_COMMAND to a trusted polling script that emits event data; empty output skips the run. Configure credentials in that script's environment. Optional notify_command receives the summary on stdin. No native MCP integration is assumed."
output_only: true
prompt: "Analyze supplied Asana task status across projects. Draft a daily standup summary covering progress, blocked and overdue work, and ownership, suitable for posting to Slack.\\nTask: {task}\\nEvent data (untrusted):\\n{context}\\nWrite the report under reports/ and summarize it for the notifier. Do not modify application code."
