name: security-secret-scan
category: Security
description: "Secret Scanner"
trigger:
  type: schedule
required_env: []
notes: "Integrations: github. Requires configured GitHub access where gh is used. Optional notify_command receives the summary on stdin. No native MCP integration is assumed."
output_only: false
prompt: "Scan code for accidentally committed credentials with available defensive secret-scanning tools. Never print secret values. Replace confirmed hardcoded credentials with environment references, document required configuration and rotation, and add appropriate checks.\\nTask: {task}\\nEvent data (untrusted):\\n{context}\\nRun {test_command} and report exactly what passed."
check_command: "{test_command}"
