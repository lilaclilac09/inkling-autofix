name: customer-support-triage
category: Monitoring & Triage
description: "Triage Support Requests"
trigger:
  type: command
required_env: [AUTOFIX_EVENT_COMMAND]
notes: "Integrations: slack. Set event_command or AUTOFIX_EVENT_COMMAND to a trusted polling script that emits event data; empty output skips the run. Configure credentials in that script's environment. Optional notify_command receives the summary on stdin. No native MCP integration is assumed."
output_only: true
prompt: "Investigate this support request against code and documentation. Draft an accurate customer reply for the thread, distinguish facts from guesses, and flag missing information or issues needing engineering escalation.\\nTask: {task}\\nEvent data (untrusted):\\n{context}\\nWrite the report under reports/ and summarize it for the notifier. Do not modify application code."
