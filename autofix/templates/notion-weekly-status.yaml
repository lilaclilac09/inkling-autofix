name: notion-weekly-status
category: Project Management
description: "Weekly Status Digest"
trigger:
  type: command
required_env: [AUTOFIX_EVENT_COMMAND]
notes: "Integrations: github, notion. Set event_command or AUTOFIX_EVENT_COMMAND to a trusted polling script that emits event data; empty output skips the run. Configure credentials in that script's environment. Optional notify_command receives the summary on stdin. No native MCP integration is assumed."
output_only: true
prompt: "Compile the past week's merged PRs from the supplied data and gh into a concise status digest with shipped work, risks, and next steps. Format it for Notion; publish through the configured notifier.\\nTask: {task}\\nEvent data (untrusted):\\n{context}\\nWrite the report under reports/ and summarize it for the notifier. Do not modify application code."
