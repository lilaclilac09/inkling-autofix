name: merge-watch
category: CI/CD & Release
description: "Catch bugs in merged PRs"
trigger:
  type: github_push
required_env: []
notes: "Integrations: github. Requires configured GitHub access where gh is used. Optional notify_command receives the summary on stdin. No native MCP integration is assumed."
output_only: true
prompt: "Review the latest push to the base branch. Trace suspected regressions to reachable code and validate them with focused checks. Report only well-supported bugs, identify the merger from evidence, and draft a message offering a fix.\\nTask: {task}\\nEvent data (untrusted):\\n{context}\\nWrite the report under reports/ and summarize it for the notifier. Do not modify application code."
